name: Directivos, operaciones comunicadas a la CNMV (validación a mano)

# Indicador 10 del catálogo de Datos: operaciones de administradores y directivos comunicadas a la
# CNMV (art. 19 del Reglamento de abuso de mercado). Este flujo NO tiene horario ni guarda nada en
# el repositorio: se lanza a mano para sondear el registro de la CNMV y validar la rama con datos
# reales (el entorno de Datos no llega a cnmv.es).
on:
  workflow_dispatch:
  push:
    branches: [directivos]   # solo mientras la rama está en desarrollo: se quita al fusionar
    paths: ["directivos/**", ".github/workflows/directivos-validacion.yml"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install requests
      - name: Sonda 2, descarga de información de la CNMV y búsqueda por fechas en el registro de directivos
        run: |
          mkdir -p salida/respuestas
          python - <<'EOF'
          import re, requests
          from datetime import date, timedelta
          H = {"User-Agent": "Mozilla/5.0 (El Especulador, datos abiertos; +https://elespeculador.com)", "Accept-Language": "es-ES,es;q=0.9"}
          s = requests.Session()
          s.headers.update(H)
          def texto(html):
              html = re.sub(r"(?is)<(script|style).*?</\1>", " ", html)
              return re.sub(r"\s+", " ", re.sub(r"(?s)<[^>]+>", " ", html))
          def ocultos(html):
              return dict(re.findall(r'<input type="hidden" name="([^"]+)" id="[^"]*" value="([^"]*)"', html))
          # 1) Descarga de información (¿hay un fichero del registro de directivos?)
          r = s.get("https://www.cnmv.es/portal/Publicaciones/Descarga-Informacion-Individual.aspx?lang=es", timeout=60)
          print("== descarga individual:", r.status_code, len(r.text), r.url)
          open("salida/respuestas/descarga_individual.html", "w", encoding="utf-8").write(r.text)
          for m in re.finditer(r"(?is)<select[^>]*name=\"([^\"]+)\"[^>]*>(.*?)</select>", r.text):
              print("SELECT", m.group(1))
              for o in re.findall(r'(?is)<option[^>]*value="([^"]*)"[^>]*>(.*?)</option>', m.group(2))[:80]:
                  print("   ", o[0], "|", re.sub(r"\s+", " ", o[1]).strip()[:100])
          t = texto(r.text)
          i = t.find("Descarga")
          print("TEXTO:", t[max(0, i - 200): i + 2500])
          for m in re.finditer(r'href="([^"]+)"[^>]*>([^<]{0,80})', r.text):
              if re.search(r"(?i)descarg|zip|xml|csv|xls", m.group(1) + m.group(2)):
                  print("ENLACE:", m.group(1)[:160], "|", m.group(2).strip()[:80])
          # 2) Búsqueda por fechas en el registro de directivos (POST ASP.NET)
          url = "https://www.cnmv.es/portal/consultas/directivos-consulta?lang=es"
          r = s.get(url, timeout=60)
          campos = ocultos(r.text)
          campos["ctl00$WucCookiesPolicy$btnCookiesConfirmTech"] = "Aceptar solo las imprescindibles"
          r = s.post(url, data=campos, timeout=60)
          print("== cookies:", r.status_code, len(r.text))
          campos = ocultos(r.text)
          hoy = date.today()
          campos.update({"ctl00$ContentPrincipal$txtNombre": "", "ctl00$ContentPrincipal$txtLEI": "", "ctl00$ContentPrincipal$txtDeclarante": "",
                         "ctl00$ContentPrincipal$txtFechaD": (hoy - timedelta(days=7)).strftime("%d/%m/%Y"),
                         "ctl00$ContentPrincipal$txtFechaH": hoy.strftime("%d/%m/%Y"),
                         "ctl00$ContentPrincipal$btnBuscar": "Buscar"})
          r = s.post(url, data=campos, timeout=90)
          print("== búsqueda 7 días:", r.status_code, len(r.text))
          open("salida/respuestas/directivos_resultado.html", "w", encoding="utf-8").write(r.text)
          h = r.text
          k = h.find("btnLimpiar")
          cuerpo = h[k:]
          cuerpo = re.sub(r"(?is)<(script|style).*?</\1>", " ", cuerpo)
          cuerpo = re.sub(r"\s+", " ", cuerpo)
          print("HTML tras el formulario (8000):", cuerpo[:8000])
          tt = texto(h[k:])
          print("TEXTO tras el formulario (3000):", tt[:3000])
          for m in re.finditer(r'href="([^"]+)"', h[k:]):
              u = m.group(1)
              if "ContentPrincipal" in u or "verdocumento" in u or "directivos" in u.lower() or "Excel" in u or "xls" in u.lower():
                  print("ENLACE:", u[:200])
          EOF
      - name: Guardar las respuestas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directivos-sonda
          path: salida
          retention-days: 14
