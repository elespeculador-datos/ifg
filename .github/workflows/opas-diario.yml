name: OPAs diario

# Registro de OPAs de El Especulador, con los datos que publica BME. Una pasada
# al día hábil; solo escribe si el registro ha cambiado. Solo lee y escribe
# opas/ y docs/opas/; no toca el IFG, los cortos, el IBEX ni los dividendos.
on:
  schedule:
    - cron: "25 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: opas-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install pandas requests
      - name: Comprobar y publicar
        run: python opas/opas.py
      - name: Guardar el resultado en el repositorio
        run: |
          if [ -z "$(git status --porcelain docs/opas)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "OPAs bot"
          git config user.email "actions@github.com"
          git add docs/opas
          git commit -m "OPAs $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Abrir incidencia si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=opas-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          cuerpo="La comprobación del registro de OPAs del $(date -u +%Y-%m-%d) ha fallado. Registro: $EJECUCION. La página sigue mostrando la última versión buena. Lo más probable: la API de BME no respondía o ha cambiado de formato."
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="$cuerpo" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/labels" -f name=opas-fallido -f color=b60205 -f description="El registro de OPAs no se ha actualizado" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" -f title="El registro de OPAs no se ha actualizado el $(date -u +%Y-%m-%d)" -f body="$cuerpo" -f 'labels[]=opas-fallido' >/dev/null
          fi
      - name: Cerrar la incidencia si ya funciona
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=opas-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="Comprobación correcta el $(date -u +%Y-%m-%d). Se cierra." >/dev/null
            gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" -f state=closed >/dev/null
          fi
