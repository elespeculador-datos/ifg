name: Agenda semanal (validación a mano)

# Indicador 15 del catálogo de Datos: agenda semanal de catalizadores (subastas del Tesoro,
# publicaciones del INE, decisiones del BCE y de la Fed, euroindicadores de Eurostat).
# En producción corre en el servidor smpro-datos-1 (servidor/ejecutar.sh agenda; ver DESPLIEGUE.md).
# Este flujo NO tiene horario ni guarda nada en el repositorio: se lanza a mano para validar una
# rama con datos reales (el entorno de Datos no llega a las fuentes) y deja la salida como artefacto.
on:
  workflow_dispatch:
  push:
    branches: [agenda-semanal]   # solo mientras la rama está en desarrollo: se quita al fusionar
    paths: ["agenda/**", ".github/workflows/agenda-validacion.yml"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install requests
      - name: Comprobaciones sin red
        run: python agenda/pruebas_agenda.py
      - name: Pasada con datos reales (el calendario del Tesoro sale de docs/letras y docs/bonos)
        env:
          ESPEC_DATOS_BASE: https://datos.elespeculador.com/
        run: |
          python agenda/agenda.py --salida salida/agenda --tesoro docs --forzar | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## Fragmento" >> "$GITHUB_STEP_SUMMARY"
          echo '```html' >> "$GITHUB_STEP_SUMMARY"
          cat salida/agenda/fragmento-wp.html >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Fragmento, boletín y resumen del JSON al registro
        run: |
          echo "===== fragmento-wp.html"; cat salida/agenda/fragmento-wp.html; echo
          echo "===== boletin.html"; cat salida/agenda/boletin.html; echo
          echo "===== eventos.csv"; cat salida/agenda/datos/eventos.csv; echo
          python - <<'EOF'
          import json
          j = json.load(open("salida/agenda/datos/eventos.json", encoding="utf-8"))
          print("===== fuentes:", json.dumps(j["fuentes"], ensure_ascii=False, indent=1))
          print("semana", j["semana_inicio"], "a", j["siguiente_fin"], "| huella", j["huella"], "| citas", len(j["eventos"]))
          EOF
      - name: Guardar la salida como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-salida
          path: salida
          retention-days: 14
