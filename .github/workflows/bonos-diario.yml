name: Bonos y Obligaciones del Estado

# Resultados de las subastas de Bonos y Obligaciones del Estado, valores en emisión, calendario
# y tenedores, con los datos del Tesoro Público. Una pasada cada día laborable a las
# 12:40 UTC: los jueves de subasta el Tesoro ya ha publicado el resultado. Solo lee y
# escribe bonos/ y docs/bonos/; no toca el IFG ni los demás activos.
on:
  schedule:
    - cron: "40 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bonos-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: sudo apt-get install -y poppler-utils >/dev/null && pip install requests pandas openpyxl certifi
      - name: Consultar el Tesoro y preparar los archivos
        run: python bonos/bonos.py --salida docs/bonos
      - name: Guardar el resultado en el repositorio
        run: |
          if [ -z "$(git status --porcelain docs/bonos)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "Bonos bot"
          git config user.email "actions@github.com"
          git add docs/bonos
          git commit -m "Bonos y Obligaciones $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Abrir incidencia si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bonos-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          cuerpo="La actualización de los Bonos y Obligaciones del Estado del $(date -u +%Y-%m-%d) ha fallado. Registro: $EJECUCION. La página sigue mostrando la última actualización buena con su fecha. Lo más probable: tesoro.es no respondía o ha cambiado una tabla o un Excel."
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="$cuerpo" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/labels" -f name=bonos-fallido -f color=b60205 -f description="Los Bonos y Obligaciones no se han actualizado" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" -f title="Los Bonos y Obligaciones no se han actualizado el $(date -u +%Y-%m-%d)" -f body="$cuerpo" -f 'labels[]=bonos-fallido' >/dev/null
          fi
      - name: Cerrar la incidencia si ya funciona
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bonos-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="Actualización correcta el $(date -u +%Y-%m-%d). Se cierra." >/dev/null
            gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" -f state=closed >/dev/null
          fi
