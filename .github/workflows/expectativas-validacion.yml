name: Expectativas de inflación de los hogares (validación a mano)

# Indicador 20c del catálogo de Datos: encuesta de expectativas de los consumidores del BCE (CES).
# Flujo sin horario: se lanza a mano para sondear el conjunto CES del portal del BCE y validar la rama
# con datos reales (el entorno de Datos no llega al portal).
on:
  workflow_dispatch:
  push:
    branches: [expectativas]   # solo mientras la rama está en desarrollo: se quita al fusionar
    paths: ["expectativas/**", ".github/workflows/expectativas-validacion.yml"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install requests pandas scipy
      - name: Comprobaciones sin red
        run: test -f expectativas/pruebas_expectativas.py && python expectativas/pruebas_expectativas.py || echo "sin pruebas todavía"
      - name: Pasada con datos reales (IPC del INE desde docs/ahorro si existe)
        env:
          ESPEC_DATOS_BASE: https://datos.elespeculador.com/
        run: |
          set -o pipefail
          mkdir -p salida
          if [ -f docs/ahorro/datos/serie.csv ]; then IPC="--ipc docs/ahorro/datos/serie.csv"; else IPC=""; fi
          python expectativas/expectativas.py --salida salida/expectativas $IPC | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fragmento y resumen al registro
        run: |
          echo "===== fragmento-wp.html"; sed 's/<svg.*<\/svg>/[SVG]/' salida/expectativas/fragmento-wp.html; echo
          python - <<'EOF'
          import json
          j = json.load(open("salida/expectativas/datos/ultima.json", encoding="utf-8"))
          print("===== mes", j["mes"], "desfase", j["desfase_dias"], "ipc", j["ipc"], "brecha", j["brecha_percepcion"], "acierto", j["acierto_12m"])
          for area, f in j["fichas"].items():
              print(area, {k: (v["valor"] if v else None) for k, v in f.items()})
          EOF
      - name: Guardar las respuestas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expectativas-salida
          path: salida
          retention-days: 14
