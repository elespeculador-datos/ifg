name: IFG diario

# De madrugada, no a las 8:30: el pipeline editorial que genera "Antes de la
# apertura" corre sobre las 5:00, así que el índice tiene que estar publicado
# antes o el texto de cada mañana citaría el valor de la víspera.
#
# Dos horarios porque GitHub Actions solo entiende UTC y España cambia de hora
# dos veces al año. El script comprueba la hora local y si ya publicó hoy, así
# que de las dos ejecuciones solo una escribe. Sin mantenimiento en marzo ni
# en octubre.
on:
  schedule:
    - cron: "15 1 * * 1-5"    # 03:15 en Madrid con horario de verano
    - cron: "15 2 * * 1-5"    # 03:15 en Madrid con horario de invierno
  workflow_dispatch:          # botón para lanzarlo a mano
    inputs:
      forzar:
        description: "Publicar aunque no sea la madrugada en Madrid"
        type: boolean
        default: true

permissions:
  contents: write             # necesario para guardar el resultado en el repo
  issues: write               # para abrir una incidencia si la publicacion falla

concurrency:
  group: ifg-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar GDELT
        continue-on-error: true
        run: python backfill_gdelt.py --cada 7 --incremental

      - name: Calcular y publicar
        run: |
          if [ "${{ inputs.forzar }}" = "true" ]; then
            python publicar_diario.py --ahora
          else
            python publicar_diario.py
          fi

      - name: Verificar que la serie no se revisa
        run: python verificar_estabilidad.py

      - name: Guardar el resultado en el repositorio
        run: |
          if [ -z "$(git status --porcelain docs datos)" ]; then
            echo "Sin cambios: la ejecucion no tocaba o no produjo nada."
            exit 0
          fi
          git config user.name "IFG bot"
          git config user.email "actions@github.com"
          git add docs datos
          git commit -m "IFG $(date -u +%Y-%m-%d)"
          git push

      # LA PUBLICACION PUEDE SALIR BIEN Y AUN ASI HABER PASADO ALGO.
      # El 20 de octubre de 2026 el recalculo se separo 10,14 puntos del valor
      # cerrado del dia 14 -la mayor deriva medida- y el flujo no dijo nada,
      # porque no fallo: publico a su hora un valor correcto. Lo que se movio
      # fue el pasado. La cifra quedo en revisiones.csv, que nadie abre.
      #
      # Este paso NO detiene nada ni corrige nada: una fila cerrada es
      # inmutable. Solo convierte el marcador que deja publicar_diario.py en
      # una incidencia, con el mismo patron que el aviso de fallo: una sola
      # abierta, comentada mientras dure, y cerrada sola cuando se normaliza.
      #
      # Si no hay marcador, la ejecucion no llego a medir (por ejemplo, el
      # segundo cron del dia, que sale antes de calcular). Ausencia de
      # marcador NO es ausencia de deriva, asi que no se cierra nada.
      - name: Avisar si la deriva sobre lo ya cerrado merece mirarse
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f aviso_deriva.json ]; then
            echo "Sin marcador: esta ejecucion no ha medido deriva."
            exit 0
          fi

          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=deriva-alta" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          if [ "$(jq -r '.avisar' aviso_deriva.json)" != "true" ]; then
            if [ -n "$abierta" ]; then
              gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
                -f body="Deriva normalizada el $(date -u +%Y-%m-%d): $(jq -r '.deriva_maxima' aviso_deriva.json) puntos, sin tramos contradichos. Se cierra." >/dev/null
              gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" \
                -f state=closed >/dev/null
              echo "Cerrada la incidencia de deriva #$abierta"
            fi
            exit 0
          fi

          cuerpo=$(jq -r '
            "La ejecucion del \(.generado) mide una deriva de \(.deriva_maxima) puntos sobre filas YA CERRADAS (peor: \(.fecha_peor)), con \(.sesiones_movidas) sesiones movidas. Version \(.version)."
            + "\n\nLa serie publicada NO se ha tocado: la guardia de estabilidad sigue en verde y un dato cerrado es inmutable. Lo que se avisa es que el recalculo de hoy ya no coincide con lo que se publico."
            + (if .es_record then "\n\n**Deriva sin precedentes en esta version.** Maximo anterior: \(.record_previo // "ninguno")." else "" end)
            + (if (.cruces_de_tramo | length) > 0 then
                 "\n\n**Hay tramos publicados que el recalculo contradice** (esto es lo que importa editorialmente, porque el indice se cita por su tramo):\n\n| Fecha | Publicado | Recalculado |\n|---|---|---|\n"
                 + ([.cruces_de_tramo[:50][] | "| \(.fecha) | \(.valor_publicado) \(.tramo_publicado) | \(.valor_recalculado) \(.tramo_recalculado) |"] | join("\n"))
                 + (if (.cruces_de_tramo | length) > 50 then "\n\n... y \((.cruces_de_tramo | length) - 50) sesiones mas con el tramo contradicho; aqui se muestran las 50 primeras." else "" end)
               else "\n\nNingun tramo publicado cambia de etiqueta." end)
            + "\n\nQue mirar, por orden de probabilidad:\n1. el GPR de la Fed revisa sus ultimos dias en cada entrega de los lunes, y ademas llega con unos seis dias de retraso: compara datos/gpr.csv entre dos ejecuciones;\n2. alinear() arrastra un componente hasta tres sesiones y ese arrastre cuenta como cobertura disponible, asi que la fila cierra como definitiva sobre un dato prestado;\n3. GDELT rellena huecos hacia atras (backfill_gdelt.py).\n\nNO se republica por esto sin decision expresa: republicar sustituye valores ya publicados. Este aviso solo informa."
            ' aviso_deriva.json)
          cuerpo="$cuerpo

          Registro: $EJECUCION"

          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
              -f body="$cuerpo" >/dev/null
            echo "Comentada la incidencia de deriva abierta #$abierta"
          else
            gh api --method POST "repos/${{ github.repository }}/labels" \
              -f name=deriva-alta -f color=d93f0b \
              -f description="El recalculo se separa de valores ya cerrados" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" \
              -f title="Deriva sobre filas cerradas el $(date -u +%Y-%m-%d)" \
              -f body="$cuerpo" \
              -f 'labels[]=deriva-alta' >/dev/null
            echo "Abierta una incidencia de deriva"
          fi

      # LA OTRA FORMA DE DEJAR DE PUBLICAR EN SILENCIO: publicar a tu hora
      # el dia de antes. El 3 de noviembre de 2026 el flujo salio en verde,
      # con todas las claves de ifg.json y cobertura 1,00, y publico el
      # viernes 30 de octubre: la sesion del lunes 2 no estaba. El calendario
      # del indice son los cierres del IBEX, y esa madrugada Yahoo no
      # devolvio ni un cierre de renta variable. Sin cierre del IBEX no hay
      # sesion, y una sesion que no existe es igual que un festivo: nada
      # fallo y nada aviso.
      #
      # Este paso NO detiene nada ni rellena nada: solo convierte el
      # marcador de publicar_diario.py en una incidencia, con el mismo
      # patron que los otros dos avisos. Se cierra sola cuando la fuente
      # devuelve el cierre que faltaba.
      - name: Avisar si falta una sesion habil en la serie
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f aviso_sesion_perdida.json ]; then
            echo "Sin marcador: esta ejecucion no ha comprobado el calendario."
            exit 0
          fi

          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=sesion-perdida" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          if [ "$(jq -r '.avisar' aviso_sesion_perdida.json)" != "true" ]; then
            if [ -n "$abierta" ]; then
              gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
                -f body="Calendario normalizado el $(date -u +%Y-%m-%d): la serie llega al $(jq -r '.ultima_sesion_publicada' aviso_sesion_perdida.json) y no falta ninguna sesion habil. Se cierra." >/dev/null
              gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" \
                -f state=closed >/dev/null
              echo "Cerrada la incidencia de sesion perdida #$abierta"
            fi
            exit 0
          fi

          cuerpo=$(jq -r '
            "La ejecucion del \(.generado) ha publicado sin la sesion de \([.sesiones_perdidas[].fecha] | join(", ")). La serie se queda en **\(.ultima_sesion_publicada)**. Version \(.version)."
            + "\n\nEse dia el S&P 500 tiene cierre y NI UNO de los \(.instrumentos_de_corro | length) instrumentos de corro (acciones, ETF e indices de contado) lo tiene. No es un festivo: un festivo europeo deja abierta Nueva York y el ETF mundial y los petroleros siguen imprimiendo cierre. Es la fuente de renta variable, que no ha devuelto nada."
            + "\n\nEl calendario del indice son los cierres del IBEX, asi que sin ese cierre la sesion no existe para el indice y el dia se salta en silencio: el flujo sale en verde y ifg.json queda completo, pero con la fecha de la vispera. Eso incumple el requisito 5, publicacion puntual todos los dias habiles, que es el que cuenta la validacion prospectiva."
            + "\n\n| Sesion ausente | Instrumentos de corro sin cierre | S&P 500 ese dia |\n|---|---|---|\n"
            + ([.sesiones_perdidas[] | "| \(.fecha) | \(.instrumentos_de_corro_sin_cierre) | \(.referencia) |"] | join("\n"))
            + "\n\nQue mirar:\n1. si la fuente ya devuelve ese cierre, la proxima ejecucion mete la sesion en la serie por su cuenta y esta incidencia se cierra sola: no hay que hacer nada;\n2. si sigue sin devolverlo varios dias, el hueco se vuelve permanente y hay que decidir si se cambia de fuente para el calendario;\n3. el valor editorial de la sesion ausente nunca sale como valor del dia, porque ifg.json publica siempre la ultima fila: eso es una decision pendiente, no un fallo de este paso."
            + "\n\nNO se republica por esto. Republicar sustituye valores ya publicados y no es lo que falta aqui."
            ' aviso_sesion_perdida.json)
          cuerpo="$cuerpo

          Registro: $EJECUCION"

          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
              -f body="$cuerpo" >/dev/null
            echo "Comentada la incidencia de sesion perdida abierta #$abierta"
          else
            gh api --method POST "repos/${{ github.repository }}/labels" \
              -f name=sesion-perdida -f color=fbca04 \
              -f description="Falta una sesion habil en la serie del IFG" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" \
              -f title="Falta una sesion habil en la serie el $(date -u +%Y-%m-%d)" \
              -f body="$cuerpo" \
              -f 'labels[]=sesion-perdida' >/dev/null
            echo "Abierta una incidencia de sesion perdida"
          fi

      # UN INDICE DIARIO QUE DEJA DE PUBLICARSE EN SILENCIO ES EL PEOR FALLO
      # QUE PUEDE TENER. El requisito 5 del proyecto es puntualidad, y la
      # puntualidad no se demuestra: se vigila. Un "::error::" en el registro
      # solo lo ve quien entra a mirar, y nadie entra a mirar un flujo que
      # lleva meses saliendo bien.
      #
      # Una incidencia deja rastro permanente y dispara la notificacion de
      # GitHub por su cuenta, sin servicios externos ni claves que custodiar.
      #
      # NO SE ABRE UNA POR DIA. Si ya hay una abierta con la etiqueta
      # publicacion-fallida, se comenta en ella: un fallo que dura una semana
      # son siete comentarios en un hilo, no siete incidencias que hay que ir
      # cerrando a mano.
      - name: Abrir incidencia si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::La publicacion del IFG ha fallado. Revisa $EJECUCION"

          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=publicacion-fallida" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          cuerpo="La ejecucion del $(date -u +%Y-%m-%d) ha fallado.

          Registro: $EJECUCION

          Mientras no se arregle, la serie no avanza y la web sigue mostrando el ultimo valor bueno con su fecha, que es el comportamiento correcto pero NO es publicacion puntual.

          Que mirar primero, por orden de probabilidad:
          1. una fuente caida -> el indice deberia publicarse igual, marcado como provisional;
          2. verificar_estabilidad.py se ha negado -> algo intento mover una fila ya cerrada, y hace bien en pararlo;
          3. desajuste de version -> config.py y docs/ifg.json no coinciden: hay que republicar, no saltarse la guardia."

          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
              -f body="$cuerpo" >/dev/null
            echo "Comentada la incidencia abierta #$abierta"
          else
            gh api --method POST "repos/${{ github.repository }}/labels" \
              -f name=publicacion-fallida -f color=b60205 \
              -f description="La publicacion diaria del IFG ha fallado" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" \
              -f title="El IFG no se ha publicado el $(date -u +%Y-%m-%d)" \
              -f body="$cuerpo" \
              -f 'labels[]=publicacion-fallida' >/dev/null
            echo "Abierta una incidencia nueva"
          fi

      # Si la publicacion ha salido bien y habia una incidencia abierta por un
      # fallo anterior, se cierra sola. Una alerta que hay que apagar a mano
      # acaba ignorandose.
      - name: Cerrar la incidencia si ya se publica bien
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=publicacion-fallida" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
              -f body="Publicacion correcta el $(date -u +%Y-%m-%d). Se cierra." >/dev/null
            gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" \
              -f state=closed >/dev/null
            echo "Cerrada la incidencia #$abierta"
          fi
