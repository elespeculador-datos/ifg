name: IFG diario

# De madrugada, no a las 8:30: el pipeline editorial que genera "Antes de la
# apertura" corre sobre las 5:00, así que el índice tiene que estar publicado
# antes o el texto de cada mañana citaría el valor de la víspera.
#
# Dos horarios porque GitHub Actions solo entiende UTC y España cambia de hora
# dos veces al año. El script comprueba la hora local y si ya publicó hoy, así
# que de las dos ejecuciones solo una escribe. Sin mantenimiento en marzo ni
# en octubre.
on:
  schedule:
    - cron: "15 1 * * 1-5"    # 03:15 en Madrid con horario de verano
    - cron: "15 2 * * 1-5"    # 03:15 en Madrid con horario de invierno
  workflow_dispatch:          # botón para lanzarlo a mano
    inputs:
      forzar:
        description: "Publicar aunque no sea la madrugada en Madrid"
        type: boolean
        default: true

permissions:
  contents: write             # necesario para guardar el resultado en el repo
  issues: write               # para abrir una incidencia si la publicacion falla

concurrency:
  group: ifg-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar GDELT
        continue-on-error: true
        run: python backfill_gdelt.py --cada 7 --incremental

      - name: Calcular y publicar
        run: |
          if [ "${{ inputs.forzar }}" = "true" ]; then
            python publicar_diario.py --ahora
          else
            python publicar_diario.py
          fi

      - name: Verificar que la serie no se revisa
        run: python verificar_estabilidad.py

      - name: Guardar el resultado en el repositorio
        run: |
          if [ -z "$(git status --porcelain docs datos)" ]; then
            echo "Sin cambios: la ejecucion no tocaba o no produjo nada."
            exit 0
          fi
          git config user.name "IFG bot"
          git config user.email "actions@github.com"
          git add docs datos
          git commit -m "IFG $(date -u +%Y-%m-%d)"
          git push

      # UN INDICE DIARIO QUE DEJA DE PUBLICARSE EN SILENCIO ES EL PEOR FALLO
      # QUE PUEDE TENER. El requisito 5 del proyecto es puntualidad, y la
      # puntualidad no se demuestra: se vigila. Un "::error::" en el registro
      # solo lo ve quien entra a mirar, y nadie entra a mirar un flujo que
      # lleva meses saliendo bien.
      #
      # Una incidencia deja rastro permanente y dispara la notificacion de
      # GitHub por su cuenta, sin servicios externos ni claves que custodiar.
      #
      # NO SE ABRE UNA POR DIA. Si ya hay una abierta con la etiqueta
      # publicacion-fallida, se comenta en ella: un fallo que dura una semana
      # son siete comentarios en un hilo, no siete incidencias que hay que ir
      # cerrando a mano.
      - name: Abrir incidencia si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::La publicacion del IFG ha fallado. Revisa $EJECUCION"

          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=publicacion-fallida" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          cuerpo="La ejecucion del $(date -u +%Y-%m-%d) ha fallado.

          Registro: $EJECUCION

          Mientras no se arregle, la serie no avanza y la web sigue mostrando el ultimo valor bueno con su fecha, que es el comportamiento correcto pero NO es publicacion puntual.

          Que mirar primero, por orden de probabilidad:
          1. una fuente caida -> el indice deberia publicarse igual, marcado como provisional;
          2. verificar_estabilidad.py se ha negado -> algo intento mover una fila ya cerrada, y hace bien en pararlo;
          3. desajuste de version -> config.py y docs/ifg.json no coinciden: hay que republicar, no saltarse la guardia."

          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
              -f body="$cuerpo" >/dev/null
            echo "Comentada la incidencia abierta #$abierta"
          else
            gh api --method POST "repos/${{ github.repository }}/labels" \
              -f name=publicacion-fallida -f color=b60205 \
              -f description="La publicacion diaria del IFG ha fallado" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" \
              -f title="El IFG no se ha publicado el $(date -u +%Y-%m-%d)" \
              -f body="$cuerpo" \
              -f 'labels[]=publicacion-fallida' >/dev/null
            echo "Abierta una incidencia nueva"
          fi

      # Si la publicacion ha salido bien y habia una incidencia abierta por un
      # fallo anterior, se cierra sola. Una alerta que hay que apagar a mano
      # acaba ignorandose.
      - name: Cerrar la incidencia si ya se publica bien
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=publicacion-fallida" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" \
              -f body="Publicacion correcta el $(date -u +%Y-%m-%d). Se cierra." >/dev/null
            gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" \
              -f state=closed >/dev/null
            echo "Cerrada la incidencia #$abierta"
          fi
