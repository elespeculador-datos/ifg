name: Cortos (desarrollo)

# Flujo de pruebas del rastreador de posiciones cortas. Solo corre al subir
# cambios a la rama cortos-dev: no toca main, ni docs, ni el IFG.
on:
  push:
    branches: [cortos-dev]

permissions:
  contents: write

jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd requests
      - run: python cortos/rastreador.py > cortos/prueba.txt 2>&1; echo "salida=$?" >> cortos/prueba.txt
      - name: Guardar salida en la rama de desarrollo
        run: |
          git config user.name "Cortos bot"
          git config user.email "actions@github.com"
          git add cortos/prueba.txt docs/cortos || true
          git commit -m "Cortos: prueba en la rama de desarrollo" || exit 0
          git push
