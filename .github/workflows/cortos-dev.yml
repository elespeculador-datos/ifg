name: Cortos (desarrollo)

# Flujo de pruebas del rastreador de posiciones cortas. Solo corre al subir
# cambios a la rama cortos-dev: no toca main, ni docs, ni el IFG.
on:
  push:
    branches: [cortos-dev]

permissions:
  contents: write

jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd openpyxl requests lxml
      - run: python cortos/descubrir.py > cortos/descubrimiento.txt 2>&1 || true
      - name: Guardar salida en la rama de desarrollo
        run: |
          git config user.name "Cortos bot"
          git config user.email "actions@github.com"
          git add cortos/descubrimiento.txt cortos/NetShortPositions.xls || true
          git commit -m "Cortos: salida de descubrimiento" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: fichero-cnmv
          path: cortos/NetShortPositions.xls
          if-no-files-found: ignore
