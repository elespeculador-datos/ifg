name: Recompras, fase 0 (sonda a mano)

# Indicador 17 del catálogo de Datos, fase 0 (viabilidad): ¿se leen de forma fiable los informes semanales de
# recompra que las empresas envían a la CNMV (OIR)? Flujo sin horario ni escritura en el repositorio: se lanza
# a mano, descarga los últimos informes de hasta ocho empresas, los pasa por recompras/filas.py y compara la
# suma de acciones con el total que declara cada documento (ver recompras/LEEME.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null && pip install requests pandas openpyxl xlrd
      - name: Comprobaciones sin red
        run: python recompras/pruebas_recompras.py
      - name: Sonda de los informes semanales de recompra
        run: |
          mkdir -p salida/docs
          python - <<'EOF'
          import io, os, re, subprocess, sys, requests, pandas as pd
          sys.path.insert(0, "recompras"); import filas
          H = {"User-Agent": "Mozilla/5.0 (El Especulador, datos abiertos; +https://elespeculador.com)", "Accept-Language": "es-ES,es;q=0.9"}
          s = requests.Session(); s.headers.update(H)
          csv = s.get("https://datos.elespeculador.com/cnmv/datos/ibex35.csv", timeout=60).text
          df = pd.read_csv(io.StringIO(csv), dtype=str, keep_default_na=False)
          rec = df[df["caja"] == "recompras"].sort_values("fecha", ascending=False)
          print("recompras en el listado:", len(rec), "| empresas:", sorted(rec["empresa"].unique()))
          vistas = set(); n = 0
          for _, r in rec.iterrows():
              if r["empresa"] in vistas or n >= 8:
                  continue
              vistas.add(r["empresa"]); n += 1
              print(f"\n===== {r['empresa']} nreg {r['nreg']} {r['fecha']} | {r['texto'][:120]}")
              p = s.get(r["enlace"], timeout=60)
              h = p.text
              enlaces = [(a, re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t)).strip()) for a, t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', h, re.S)]
              cand = [(a.replace("&amp;", "&"), t) for a, t in enlaces if "verdocumento" in a.lower()]
              print("   página OIR:", p.status_code, len(h), "| documentos del comunicado:", cand[:6])
              for a, t in cand[:3]:
                  u = a if a.startswith("http") else "https://www.cnmv.es" + (a if a.startswith("/") else "/" + a)
                  g = s.get(u, timeout=90)
                  ct = g.headers.get("content-type", "")
                  print(f"   -> {g.status_code} {ct} {len(g.content)} bytes {u[:140]}")
                  cuerpo = g.content
                  nombre = f"salida/docs/{r['nreg']}_{abs(hash(u)) % 1000}"
                  if "pdf" in ct or cuerpo[:4] == b"%PDF":
                      open(nombre + ".pdf", "wb").write(cuerpo)
                      t2 = subprocess.run(["pdftotext", "-layout", nombre + ".pdf", "-"], capture_output=True, text=True).stdout
                      open(nombre + ".txt", "w", encoding="utf-8").write(t2)
                      print("   PDF texto (primeras 40 líneas no vacías):"); print("\n".join([l for l in t2.splitlines() if l.strip()][:40]))
                      fl = filas.leer_filas(t2); rs = filas.resumen(fl); dec = filas.totales_declarados(t2)
                      veredicto = "COINCIDE con el total declarado" if dec and rs["acciones"] in dec else ("sin total declarado" if not dec else f"NO coincide con {dec}")
                      print(f"   LECTOR: {rs['filas']} filas, {rs['acciones']:,} acciones, medio {rs['precio_medio']}, {rs['desde']}..{rs['hasta']}, centros {rs['centros']} -> {veredicto}")
                      print(f"   LECTOR: {rs['filas']} filas, {rs['acciones']:,} acciones -> {veredicto}", file=open(os.environ["GITHUB_STEP_SUMMARY"], "a"))
                  elif "spreadsheet" in ct or "excel" in ct or cuerpo[:2] == b"PK" or cuerpo[:8] == b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1":
                      ext = ".xlsx" if cuerpo[:2] == b"PK" else ".xls"
                      open(nombre + ext, "wb").write(cuerpo)
                      try:
                          x = pd.read_excel(nombre + ext, sheet_name=None, header=None)
                          for hoja, t3 in x.items():
                              print(f"   hoja {hoja}: {t3.shape}"); print(t3.head(25).to_string()[:3000])
                      except Exception as e:
                          print("   no se pudo leer el Excel:", e)
                  else:
                      print("   otro contenido:", re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", g.text))[:800])
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recompras-sonda
          path: salida
          retention-days: 14
