name: Cortos diario

# Rastreador de posiciones cortas de El Especulador. La CNMV publica las
# posiciones en su web a lo largo del día, pero el fichero NetShortPositions.xls
# se regenera por la noche (el 19/10/2026, a las 18:18 UTC, 20:18 en Madrid).
# Por eso se mira tres veces: 18:40 y 19:40 UTC (después de esa hora, con horario
# de verano y de invierno) y a las 05:00 UTC por si la CNMV se retrasa. El
# script no publica dos veces la misma fecha de la CNMV, así que solo escribe
# la primera ejecución que encuentra un fichero nuevo.
#
# Es independiente del IFG: solo lee y escribe cortos/ y docs/cortos/.
on:
  schedule:
    - cron: "40 18 * * 1-5"
    - cron: "40 19 * * 1-5"
    - cron: "0 5 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cortos-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install pandas xlrd requests
      - name: Descargar y publicar
        run: python cortos/rastreador.py
      - name: Guardar el resultado en el repositorio
        run: |
          if [ -z "$(git status --porcelain docs/cortos)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "Cortos bot"
          git config user.email "actions@github.com"
          git add docs/cortos
          git commit -m "Cortos $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Abrir incidencia si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=cortos-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          cuerpo="La actualización del rastreador de posiciones cortas del $(date -u +%Y-%m-%d) ha fallado. Registro: $EJECUCION. La página sigue mostrando la última publicación buena con su fecha. Lo más probable: la CNMV ha cambiado el formato del fichero NetShortPositions.xls o su web no respondía."
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="$cuerpo" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/labels" -f name=cortos-fallido -f color=b60205 -f description="El rastreador de cortos no se ha actualizado" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" -f title="El rastreador de cortos no se ha actualizado el $(date -u +%Y-%m-%d)" -f body="$cuerpo" -f 'labels[]=cortos-fallido' >/dev/null
          fi
      - name: Cerrar la incidencia si ya funciona
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=cortos-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="Actualización correcta el $(date -u +%Y-%m-%d). Se cierra." >/dev/null
            gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" -f state=closed >/dev/null
          fi
