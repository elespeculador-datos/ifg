name: Capitalización diario

# Las empresas más grandes de la bolsa española y las que más suben y bajan en el
# año, con la lista de cotizadas, las fichas y el histórico de precios de BME. Una
# pasada al día, de madrugada (UTC), cuando BME ya tiene el cierre de la víspera.
# Solo lee y escribe capitalizacion/ y docs/capitalizacion/; no toca el IFG ni los
# demás activos.
on:
  schedule:
    - cron: "30 5 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: capitalizacion-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install requests
      - name: Calcular y publicar
        run: python capitalizacion/ranking.py --salida docs/capitalizacion
      - name: Guardar el resultado en el repositorio
        run: |
          if [ -z "$(git status --porcelain docs/capitalizacion)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "Capitalización bot"
          git config user.email "actions@github.com"
          git add docs/capitalizacion
          git commit -m "Capitalización $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Abrir incidencia si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=capitalizacion-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          cuerpo="La actualización de las empresas más grandes de la bolsa del $(date -u +%Y-%m-%d) ha fallado. Registro: $EJECUCION. La página sigue mostrando la última actualización buena con su fecha. Lo más probable: la API de BME no respondía o ha cambiado de formato."
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="$cuerpo" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/labels" -f name=capitalizacion-fallido -f color=b60205 -f description="Las empresas más grandes de la bolsa no se han actualizado" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues" -f title="Las empresas más grandes de la bolsa no se han actualizado el $(date -u +%Y-%m-%d)" -f body="$cuerpo" -f 'labels[]=capitalizacion-fallido' >/dev/null
          fi
      - name: Cerrar la incidencia si ya funciona
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=capitalizacion-fallido" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierta" ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/$abierta/comments" -f body="Actualización correcta el $(date -u +%Y-%m-%d). Se cierra." >/dev/null
            gh api --method PATCH "repos/${{ github.repository }}/issues/$abierta" -f state=closed >/dev/null
          fi
